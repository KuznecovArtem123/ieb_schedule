{% extends "base.html" %} {% block content %}
<h3 class="mb-4">Импорт групп и преподавателей из Excel</h3>
<form
  method="post"
  enctype="multipart/form-data"
  class="d-flex flex-column w-50"
  novalidate
>
  {% csrf_token %} 
  {% for field in form %} 
    {% include "components/form_field.html" with field=field %} 
  {% endfor %}
  <div class="d-flex">
    <a class="button button--secondary me-auto" href="{% url 'panel' %}"
      >Отмена</a
    >
    <button type="submit" class="button button--primary">
      Показать данные
    </button>
  </div>
</form>
{% endblock content %}
